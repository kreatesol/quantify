name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: quantify
          POSTGRES_PASSWORD: quantify
          POSTGRES_DB: quantify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://quantify:quantify@localhost:5432/quantify_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the buyer web app
        run: pnpm --filter @quantify/buyer build:web
