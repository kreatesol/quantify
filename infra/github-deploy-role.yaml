AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions in kreatesol/quantify deploy the Quantify development
  environment to this AWS account, without storing AWS keys in GitHub.

Parameters:
  GitHubOrg:
    Type: String
    Default: kreatesol
  GitHubRepo:
    Type: String
    Default: quantify
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Choose false if this AWS account already has the token.actions.githubusercontent.com identity provider.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: quantify-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs that run in the repo's "development" environment.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:development
      Policies:
        - PolicyName: assume-cdk-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CDK deploys through the roles that "cdk bootstrap" created,
              # so this role needs nothing beyond permission to use them.
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-*-${AWS::AccountId}-us-east-1

Outputs:
  DeployRoleArn:
    Description: Save this as the AWS_DEPLOY_ROLE_ARN variable in the GitHub repository.
    Value: !GetAtt DeployRole.Arn
